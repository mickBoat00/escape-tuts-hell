name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCOUNT_ID: 305870070165
      AWS_REGION: eu-west-2
      ECR_REPO: main
      IMAGE_TAG: esc
      TRANSCRIBE_IMAGE_TAG: transcribe
      STATUS_IMAGE_TAG: statuses
      LLM_IMAGE_TAG: llm
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: eu-west-2

    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

    # Build and push docker images for backend lambdas
    - name: Build and Push backend Lambda
      run: |
        cd backend
        docker buildx build \
          --platform linux/amd64 \
          --provenance=false \
          --sbom=false \
          --load \
          -t $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$IMAGE_TAG .
        docker push $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$IMAGE_TAG

    - name: Build and Push transcription lambda
      run: |
        cd workflow/transcribe
        docker buildx build \
          --platform linux/amd64 \
          --provenance=false \
          --sbom=false \
          --load \
          -t $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$TRANSCRIBE_IMAGE_TAG .
        docker push $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$TRANSCRIBE_IMAGE_TAG

    - name: Build and Push status updater lambda
      run: |
        cd workflow/StatusUpdater
        docker buildx build \
          --platform linux/amd64 \
          --provenance=false \
          --sbom=false \
          --load \
          -t $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$STATUS_IMAGE_TAG .
        docker push $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$STATUS_IMAGE_TAG

    - name: Build and Push llm lambda
      run: |
        cd workflow/ContentGenerator
        docker buildx build \
          --platform linux/amd64 \
          --provenance=false \
          --sbom=false \
          --load \
          -t $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$LLM_IMAGE_TAG .
        docker push $AWS_ACCOUNT_ID.dkr.ecr.eu-west-2.amazonaws.com/$ECR_REPO:$LLM_IMAGE_TAG

    - name: Export TF_VAR for Terraform
      run: |
        echo "TF_VAR_backend_image_tag=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "TF_VAR_mongodb_uri=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV
        echo "TF_VAR_mongodb_db=${{ secrets.MONGODB_DB }}" >> $GITHUB_ENV
        echo "TF_VAR_mongodb_collection=${{ secrets.MONGODB_COLLECTION }}" >> $GITHUB_ENV
        echo "TF_VAR_transcibe_image_tag=${{ env.TRANSCRIBE_IMAGE_TAG }}" >> $GITHUB_ENV
        echo "TF_VAR_assemblyai_api_key=${{ secrets.ASSEMBLYAI_API_KEY }}" >> $GITHUB_ENV
        echo "TF_VAR_status_image_tag=${{ env.STATUS_IMAGE_TAG }}" >> $GITHUB_ENV
        echo "TF_VAR_llm_image_tag=${{ env.LLM_IMAGE_TAG }}" >> $GITHUB_ENV
        echo "TF_VAR_gemini_api_key=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV

    # Terraform deployment
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0
        terraform_wrapper: false

    - name: Terraform Init
      run: |
        terraform init -backend-config="bucket=configs-305870070165"
      working-directory: ./infra

    - name: Terraform Validate
      run: terraform validate
      working-directory: ./infra

    - name: Terraform Plan
      run: terraform plan
      working-directory: ./infra

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./infra

    # Get Terraform outputs
    - name: Get Terraform Outputs
      id: terraform-outputs
      run: |
        cd infra
        API_URL=$(terraform output -raw api_base_url)
        BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
        DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
        
        echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
        echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
        echo "distribution_id=${DISTRIBUTION_ID}" >> $GITHUB_OUTPUT
        
        echo "API URL: ${API_URL}"
        echo "Bucket: ${BUCKET_NAME}"
        echo "Distribution: ${DISTRIBUTION_ID}"

    # Build and deploy frontend
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend
      env:
        VITE_API_BASE_URL: ${{ steps.terraform-outputs.outputs.api_url }}
      run: |
        cd frontend
        npm run build
        echo "Frontend built with API URL: $VITE_API_BASE_URL"

    - name: Deploy to S3
      run: |
        # Sync all files except index.html with long cache
        aws s3 sync frontend/dist s3://${{ steps.terraform-outputs.outputs.bucket_name }} \
          --delete \
          --cache-control "public, max-age=31536000, immutable" \
          --exclude "index.html"
        
        # Upload index.html with no cache
        aws s3 cp frontend/dist/index.html \
          s3://${{ steps.terraform-outputs.outputs.bucket_name }}/index.html \
          --cache-control "public, max-age=0, must-revalidate"

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ steps.terraform-outputs.outputs.distribution_id }} \
          --paths "/*"

    - name: Deployment Summary
      run: |
        echo "🚀 Deployment Complete!"
        echo "📦 Backend API: ${{ steps.terraform-outputs.outputs.api_url }}"
        echo "🌐 Frontend URL: Check Terraform outputs for CloudFront URL"